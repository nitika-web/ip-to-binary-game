<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0b0c" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IP to Binary</title>
<style>
/* Default is the inverted look: light text on near-black. The Invert button flips it. */
:root,:root[data-theme="dark"]{
  --bg:#0b0b0c;--surface:#151517;--ink:#f4f4f5;--on-ink:#0b0b0c;--muted:#8c8c93;--line:#2c2c31;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f4;--surface:#ffffff;--ink:#0d0d0e;--on-ink:#f6f6f4;--muted:#6b6b72;--line:#d8d8d4;color-scheme:light;
}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Liberation Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);overscroll-behavior-y:none;touch-action:pan-x pan-y} /* pan-x pan-y = scrolling yes, pinch / double-tap zoom no */
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;
  /* Nothing on the page is selectable or copyable (inputs excepted, so typing works everywhere) */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.app{
  min-height:100vh;min-height:100dvh;min-height:var(--vh,100dvh);
  max-width:680px;margin:0 auto;
  --pad:clamp(16px,4.5vw,32px);
  padding:var(--pad);
  padding:calc(var(--pad) + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right)) calc(var(--pad) + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:clamp(14px,3vh,26px);
}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
.toolbar{display:flex;gap:8px}
.chip{
  height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);
  font:500 .85rem/1 var(--sans);cursor:pointer;-webkit-appearance:none;appearance:none;
  transition:background .15s,border-color .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
@media (hover:hover){.chip:hover{border-color:var(--ink)}}

main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,22px);min-width:0}
.eyebrow{margin:0;text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.ip{
  display:block;margin:0;text-align:center;white-space:nowrap;
  font:700 2.2rem/1.1 var(--mono);letter-spacing:-.03em; /* JS fits the size to the width */
}
.ruler{position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;width:auto}
.weights{display:flex;gap:4px;font:.75rem var(--mono)}
.weights span{flex:1;text-align:center;background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 0}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
@media (min-width:640px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:.8rem}
.field label b{color:var(--ink);font-weight:650}
input{
  display:block;width:100%;height:52px;margin:0;padding:0 4px;text-align:center;
  font-family:var(--mono);font-weight:500;font-size:18px;font-size:clamp(17px,4.6vw,22px);line-height:1;letter-spacing:.06em;color:var(--ink);background:var(--surface);caret-color:var(--ink);
  border:1px solid var(--line);border-radius:14px;-webkit-appearance:none;appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
input::placeholder{color:var(--muted);opacity:.45}
input:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
input[aria-invalid="true"]{border:1px dashed var(--ink)}
input[readonly]{-webkit-text-fill-color:var(--ink);opacity:1}
input.ok{border-color:var(--ink)}

.feedback{min-height:3.3em;text-align:center}
.msg{margin:0;color:var(--muted);font-size:.95rem}
.msg.err,.msg.ok{color:var(--ink);font-weight:600}
.msg.err::before{content:"\2715\00a0"}
.msg.ok::before{content:"\2713\00a0"}
.answer{margin:2px 0 0;color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:.85rem;font-size:min(.95rem,calc((100vw - 2 * var(--pad)) / 22))}

/* On-screen 0 / 1 keypad: shown on touch devices, so no system keyboard covers the screen */
.keypad{display:none;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (pointer:coarse){.keypad{display:grid}}
.keypad.off{opacity:.4}
.key{
  height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 1.6rem/1 var(--mono);cursor:pointer;-webkit-appearance:none;appearance:none;padding:0;
  transition:background .08s,color .08s;
}
.key.back{font-size:1.3rem}
.key:active{background:var(--ink);color:var(--on-ink)}

.row{display:flex;gap:10px}
.btn{
  height:52px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--ink);
  font:600 1rem/1 var(--sans);cursor:pointer;-webkit-appearance:none;appearance:none;transition:opacity .15s,border-color .15s;
}
.btn.primary{flex:1;background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ghost{padding:0 22px}
.btn:active{opacity:.7}
@media (hover:hover){.btn.ghost:hover{border-color:var(--ink)}.btn.primary:hover{opacity:.9}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:0;padding-top:14px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.15rem;font-weight:650;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}

/* Short screens (small phones, landscape): tighten everything so it all stays in view */
.compact .app{gap:12px}
.compact main{gap:10px}
.compact .eyebrow{display:none}
.compact input{height:46px}
.compact .key,.compact .btn{height:48px}
.compact .feedback{min-height:2.7em}
.compact .stats{padding-top:10px}
.compact .stats b{font-size:1rem}
@media (max-width:340px){.fields{gap:10px 8px}.chip{padding:0 11px}}
@media (min-width:900px){.app{max-width:720px}.key,.btn,input{height:58px}}

.shake{animation:shake .32s linear}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>IP to Binary</h1>
    <div class="toolbar">
      <button class="chip" id="weights-btn" type="button" aria-pressed="false">Weights</button>
      <button class="chip" id="invert" type="button">Invert</button>
    </div>
  </header>

  <main id="card">
    <p class="eyebrow">Write it in binary</p>
    <p class="ip" id="ip" aria-live="polite"></p>
    <span class="ip ruler" id="ruler" aria-hidden="true">255.255.255.255</span>
    <div class="weights" id="wt" hidden><span>128</span><span>64</span><span>32</span><span>16</span><span>8</span><span>4</span><span>2</span><span>1</span></div>
    <div class="fields" id="fields"></div>
    <div class="feedback" aria-live="polite">
      <p class="msg" id="msg"></p>
      <p class="answer" id="answer"></p>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" type="button" data-k="0" aria-label="Zero">0</button>
      <button class="key" type="button" data-k="1" aria-label="One">1</button>
      <button class="key back" type="button" data-k="back" aria-label="Delete">&#9003;</button>
    </div>
    <div class="row">
      <button class="btn primary" id="check" type="button">Check</button>
      <button class="btn ghost" id="skip" type="button">Skip</button>
    </div>
  </main>

  <div class="stats">
    <div><b id="ns">0</b><span>Solved</span></div>
    <div><b id="ne">0</b><span>Errors</span></div>
    <div><b id="nk">0</b><span>Streak</span></div>
    <div><b id="nb">0</b><span>Best</span></div>
  </div>
</div>

<script>
/* ============ Logic ============ */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = arr => arr[rnd(0, arr.length - 1)];
const bin8 = v => v.toString(2).padStart(8, '0');

// A fresh home/office-style address every time, e.g. 192.168.10.1, 10.4.77.23, 172.20.3.101.
// Hundreds of thousands of possibilities; third number is often small and hosts are often .1 .10 .100 .254.
function genIp() {
  const third = () => Math.random() < 0.5 ? rnd(0, 20) : rnd(0, 255);
  const host = () => Math.random() < 0.3 ? pickOne([1, 2, 10, 100, 101, 200, 254]) : rnd(1, 254);
  const r = Math.random();
  if (r < 0.6) return [192, 168, third(), host()];
  if (r < 0.85) return [10, rnd(0, 255), rnd(0, 255), host()];
  return [172, rnd(16, 31), third(), host()];
}

// One octet: 1 to 8 binary digits whose value matches.
const okBits = (s, v) => { s = s.replace(/\s+/g, ''); return /^[01]{1,8}$/.test(s) && parseInt(s, 2) === v; };
/* ---- logic end ---- */

/* ============ UI ============ */
const $ = id => document.getElementById(id);
const ipEl = $('ip'), rulerEl = $('ruler'), fieldsEl = $('fields'), msgEl = $('msg'), answerEl = $('answer');
const checkBtn = $('check'), skipBtn = $('skip'), cardEl = $('card'), keypadEl = $('keypad');
const root = document.documentElement;
const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); // phones / tablets

let ip = [], inputs = [], cur = 0, done = false, lastIp = '';
let solved = 0, errors = 0, streak = 0, best = loadBest();

function loadBest() { try { const v = parseInt(localStorage.getItem('ip2bin-best'), 10); return v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest() { try { localStorage.setItem('ip2bin-best', String(best)); } catch (e) {} }
function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = 'msg' + (cls ? ' ' + cls : ''); }
function updateStats() { $('ns').textContent = solved; $('ne').textContent = errors; $('nk').textContent = streak; $('nb').textContent = best; }

/* ---- Fit to any screen ---- */
// One font size for every address, chosen so the longest possible one (255.255.255.255) fits on a single line.
function fitIp() {
  rulerEl.style.fontSize = '100px';
  const need = rulerEl.getBoundingClientRect().width, have = ipEl.clientWidth;
  ipEl.style.fontSize = (need > 0 && have > 0) ? Math.max(18, Math.min(64, Math.floor(100 * have / need * 0.97))) + 'px' : '';
}
// Uses the visible area (shrinks with browser bars / rotation) and switches to a tighter layout on short screens.
function layout() {
  const vv = window.visualViewport;
  const h = (vv && vv.height) || window.innerHeight || 800;
  root.style.setProperty('--vh', Math.round(h) + 'px');
  root.classList.toggle('compact', h < 640);
  fitIp();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

/* ---- No zooming ---- */
// Safari pinch (iPhone, iPad, Mac trackpad), two-finger pinch elsewhere, Ctrl/Cmd + scroll wheel, and Ctrl/Cmd + / - / 0.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) e.preventDefault(); });

/* ---- No copy / paste / drag-in ---- */
const block = e => e.preventDefault();
['copy', 'cut', 'drop', 'dragover', 'dragstart'].forEach(t => document.addEventListener(t, block));
document.addEventListener('paste', e => { e.preventDefault(); if (!done) setMsg('Pasting is turned off. Type your answer.'); });
document.addEventListener('contextmenu', e => { if (e.target && (e.target.tagName === 'INPUT' || e.target === ipEl)) e.preventDefault(); });
document.addEventListener('touchstart', () => {}, { passive: true }); // lets :active styles work on iOS Safari

/* ---- Round handling ---- */
function newAddress() {
  let next;
  do { next = genIp(); } while (next.join('.') === lastIp);
  ip = next; lastIp = ip.join('.'); done = false; cur = 0;
  ipEl.textContent = lastIp;
  answerEl.textContent = '';
  checkBtn.textContent = 'Check'; skipBtn.hidden = false; keypadEl.classList.remove('off');
  setMsg('');
  buildFields();
  layout();
  inputs[0].focus({ preventScroll: true });
}

function setVal(i, v) {
  inputs[i].value = v; inputs[i]._prev = v;
  inputs[i].setAttribute('aria-invalid', 'false');
}

function buildFields() {
  fieldsEl.textContent = '';
  inputs = ip.map((v, i) => {
    const wrap = document.createElement('div'); wrap.className = 'field';
    const lab = document.createElement('label'); lab.htmlFor = 'f' + i;
    lab.append('Octet ' + (i + 1) + ': ');
    const b = document.createElement('b'); b.textContent = v; lab.appendChild(b);
    const inp = document.createElement('input');
    inp._prev = '';
    inp.id = 'f' + i; inp.type = 'text'; inp.placeholder = '00000000';
    inp.setAttribute('inputmode', coarse ? 'none' : 'numeric'); // touch devices use the on-screen keypad
    inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('spellcheck', 'false');
    inp.setAttribute('enterkeyhint', i === 3 ? 'done' : 'next');
    inp.addEventListener('focus', () => { cur = i; });
    inp.addEventListener('beforeinput', e => {
      // refuse anything that isn't a single typed character: paste, drop, autofill, dictation, replacement text
      if (/^insert(FromPaste|FromDrop|FromYank|ReplacementText|FromPasteAsQuotation)$/.test(e.inputType || '') || (e.data && e.data.length > 1)) e.preventDefault();
    });
    inp.addEventListener('input', () => onType(i));
    inp.addEventListener('keydown', e => onKey(e, i));
    wrap.append(lab, inp); fieldsEl.appendChild(wrap);
    return inp;
  });
}

// Physical keyboards: only 0 and 1 are kept, "." or space jumps ahead, 8 bits jumps ahead.
function onType(i) {
  const inp = inputs[i], raw = inp.value;
  if (raw.length - inp._prev.length > 1) { inp.value = inp._prev; return; } // several characters at once = paste-like, undo it
  const sep = /[.\s]$/.test(raw);
  const v = raw.replace(/[^01]/g, '').slice(0, 8);
  setVal(i, v);
  if (v && (v.length === 8 || sep) && i < inputs.length - 1) { inputs[i + 1].focus(); inputs[i + 1].select(); }
}

function onKey(e, i) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!done && i < inputs.length - 1 && !inputs[i + 1].value.trim()) inputs[i + 1].focus(); else check();
  } else if (e.key === 'Backspace' && !inputs[i].value && i > 0) {
    inputs[i - 1].focus();
  }
}

// On-screen keypad (touch devices)
function press(k) {
  if (done || !inputs.length) return;
  const inp = inputs[cur];
  if (k === 'back') {
    if (inp.value) setVal(cur, inp.value.slice(0, -1));
    else if (cur > 0) { cur--; setVal(cur, inputs[cur].value.slice(0, -1)); }
  } else if (inp.value.length < 8) {
    setVal(cur, inp.value + k);
    if (inputs[cur].value.length === 8 && cur < inputs.length - 1) cur++;
  }
  inputs[cur].focus({ preventScroll: true });
}
keypadEl.querySelectorAll('.key').forEach(b => {
  b.addEventListener('mousedown', e => e.preventDefault()); // keep focus in the box on desktop
  b.addEventListener('click', () => press(b.dataset.k));
});

function check() {
  if (done) { newAddress(); return; }
  inputs.forEach(x => x.setAttribute('aria-invalid', 'false'));
  const empty = inputs.find(x => !x.value.trim());
  if (empty) { setMsg('Fill in all four boxes.', 'err'); empty.focus({ preventScroll: true }); return; }
  const ok = inputs.map((x, i) => okBits(x.value, ip[i]));
  if (ok.every(Boolean)) {
    solved++; streak++;
    if (streak > best) { best = streak; saveBest(); }
    done = true; inputs.forEach(x => { x.readOnly = true; x.classList.add('ok'); });
    setMsg('Correct.', 'ok');
    answerEl.textContent = ip.map(bin8).join('.');
    checkBtn.textContent = 'Next address'; skipBtn.hidden = true; keypadEl.classList.add('off');
    updateStats();
    return;
  }
  errors++; streak = 0; updateStats();
  const wrong = [];
  ok.forEach((g, i) => { if (!g) { inputs[i].setAttribute('aria-invalid', 'true'); wrong.push(i + 1); } });
  setMsg('Not quite. Recheck octet' + (wrong.length > 1 ? 's ' : ' ') + wrong.join(', ') + '.', 'err');
  cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
  cur = wrong[0] - 1; inputs[cur].focus({ preventScroll: true });
}

checkBtn.addEventListener('click', check);
skipBtn.addEventListener('click', () => { if (!done) newAddress(); });
$('weights-btn').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  $('wt').hidden = !on; layout();
});
$('invert').addEventListener('click', () => {
  const light = root.dataset.theme !== 'light';
  root.dataset.theme = light ? 'light' : 'dark';
  $('tc').setAttribute('content', light ? '#f6f6f4' : '#0b0b0c'); // browser bar colour on iPhone / Android
});

updateStats();
newAddress();
</script>
</body>
</html>
