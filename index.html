<meta name="apple-mobile-web-app-title" content="IP to Binary">
<style>
/* Default is the inverted look: light text on near-black. The Theme control flips it. */
:root,:root[data-theme="dark"]{
  --bg:#0b0b0c;--surface:#151517;--ink:#f4f4f5;--on-ink:#0b0b0c;--muted:#8c8c93;--line:#2c2c31;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f4;--surface:#ffffff;--ink:#0d0d0e;--on-ink:#f6f6f4;--muted:#6b6b72;--line:#d8d8d4;color-scheme:light;
}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Liberation Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
/* Scroll where needed, but never show the scrollbar itself */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);overscroll-behavior-y:none;touch-action:pan-x pan-y} /* pan-x pan-y = scrolling yes, pinch / double-tap zoom no */
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;
  /* Nothing on the page is selectable or copyable (inputs excepted, so typing works everywhere) */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.app{
  min-height:100vh;min-height:100dvh;min-height:var(--vh,100dvh);
  max-width:680px;margin:0 auto;
  --pad:clamp(16px,4.5vw,32px);
  padding:var(--pad);
  padding:calc(var(--pad) + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right)) calc(var(--pad) + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:clamp(14px,3vh,26px);
}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;flex:none}
.chip{
  height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);
  font:500 .85rem/1 var(--sans);cursor:pointer;-webkit-appearance:none;appearance:none;
  transition:background .15s,border-color .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
@media (hover:hover){.chip:hover{border-color:var(--ink)}}

main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,22px);min-width:0}
.eyebrow{margin:0;text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.ip{
  display:block;margin:0;text-align:center;white-space:nowrap;
  font:700 2.2rem/1.1 var(--mono);letter-spacing:-.03em; /* JS fits the size to the width */
}
.ruler{position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;width:auto}
.wt-wrap{display:flex;flex-direction:column;gap:4px}
.weights{display:flex;gap:4px;font:.75rem var(--mono)}
.weights span{flex:1;text-align:center;background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 0}
.weights.pow span{background:none;padding:0;font-size:.78rem;color:var(--ink)}
sup{font-size:.72em;line-height:0;vertical-align:baseline;position:relative;top:-.5em}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
@media (min-width:640px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:.8rem}
.field label b{color:var(--ink);font-weight:650}
input{
  display:block;width:100%;height:52px;margin:0;padding:0 4px;text-align:center;
  font-family:var(--mono);font-weight:500;font-size:18px;font-size:clamp(17px,4.6vw,22px);line-height:1;letter-spacing:.06em;color:var(--ink);background:var(--surface);caret-color:var(--ink);
  border:1px solid var(--line);border-radius:14px;-webkit-appearance:none;appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
input::placeholder{color:var(--muted);opacity:.45}
input:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
input[aria-invalid="true"]{border:1px dashed var(--ink)}
input[readonly]{-webkit-text-fill-color:var(--ink);opacity:1}
input.ok{border-color:var(--ink)}
input.peek{cursor:pointer;caret-color:transparent}
input.reveal[readonly]{background:var(--ink);border:1px solid var(--ink);-webkit-text-fill-color:var(--on-ink);color:var(--on-ink)}
/* Stop the browser's autofill suggestions from painting their own
   background/text colour over the themed inputs */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink);caret-color:var(--ink);
  box-shadow:0 0 0 1000px var(--surface) inset;-webkit-box-shadow:0 0 0 1000px var(--surface) inset;
  transition:background-color 9999s ease-in-out 0s;
}

.feedback{min-height:3.3em;text-align:center}
.msg{margin:0;color:var(--muted);font-size:.95rem}
.msg.err,.msg.ok{color:var(--ink);font-weight:600}
.msg.err::before{content:"\2715\00a0"}
.msg.ok::before{content:"\2713\00a0"}
.answer{margin:2px 0 0;color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:.85rem;font-size:min(.95rem,calc((100vw - 2 * var(--pad)) / 22))}

/* On-screen 0 / 1 keypad: shown on touch devices, so no system keyboard covers the screen */
.keypad{display:none;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (pointer:coarse){.keypad{display:grid}}
.keypad.off{opacity:.4}
.key{
  height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 1.6rem/1 var(--mono);cursor:pointer;-webkit-appearance:none;appearance:none;padding:0;
  transition:background .08s,color .08s;
}
.key.back{font-size:1.3rem}
.key:active{background:var(--ink);color:var(--on-ink)}

.row{display:flex;gap:10px}
.btn{
  height:52px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--ink);
  font:600 1rem/1 var(--sans);cursor:pointer;-webkit-appearance:none;appearance:none;transition:opacity .15s,border-color .15s;
}
.btn.primary{flex:1;background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ghost{padding:0 22px}
.btn:active{opacity:.7}
@media (hover:hover){.btn.ghost:hover{border-color:var(--ink)}.btn.primary:hover{opacity:.9}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:0;padding-top:14px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.15rem;font-weight:650;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}

/* "See why" link under the answer */
.link{margin-top:6px;padding:6px 4px;border:0;background:none;color:var(--ink);font:600 .9rem/1 var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer;-webkit-appearance:none;appearance:none}
.link:active{opacity:.6}

/* Pop-up: the lesson opens over the page after a wrong answer (bottom sheet on phones, centred on wide screens) */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.sheet{
  width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  transform:translateY(28px);transition:transform .24s cubic-bezier(.2,.8,.2,1);
}
.overlay.show .sheet{transform:none}
@media (min-width:640px){
  .overlay{align-items:center;padding:24px}
  .sheet{max-height:min(780px,100%);border-bottom:1px solid var(--line);border-radius:24px}
}
/* Smaller pop-up for shorter content (e.g. the mode list), so it
   reads as a modal over the app instead of covering the screen */
.sheet.compact{max-height:min(68vh,520px);max-height:min(68dvh,520px)}
@media (min-width:640px){.sheet.compact{max-height:min(520px,80%)}}

<script>
/* ============ [LOGIC] helpers ============ */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = arr => arr[rnd(0, arr.length - 1)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bin8 = v => v.toString(2).padStart(8, '0');
const W = [128, 64, 32, 16, 8, 4, 2, 1];
const POW = [7, 6, 5, 4, 3, 2, 1, 0];
const list = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const ipStr = a => a.join('.');
const toInt = a => (((a[0] << 24) | (a[1] << 16) | (a[2] << 8) | a[3]) >>> 0);
const toArr = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
const maskInt = p => p <= 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0;
const maskArr = p => toArr(maskInt(p));
const pow2 = n => Math.pow(2, n);
const strip = s => String(s).replace(/\^[0-9?]+/g, m => m.slice(1));

/* [LOGIC] address generators */
function genIp() { // home/office style
  const third = () => Math.random() < 0.5 ? rnd(0, 20) : rnd(0, 255);
  const host = () => Math.random() < 0.3 ? pickOne([1, 2, 10, 100, 101, 200, 254]) : rnd(1, 254);
  const r = Math.random();
  if (r < 0.6) return [192, 168, third(), host()];
  if (r < 0.85) return [10, rnd(0, 255), rnd(0, 255), host()];
  return [172, rnd(16, 31), third(), host()];
}
function genIpHard() {
  let a; do { a = rnd(1, 223); } while (a === 127);
  return [a, rnd(0, 255), rnd(0, 255), rnd(1, 254)];
}
function genIpEasy() { return [pickOne([192, 10]), rnd(0, 63), rnd(0, 63), rnd(1, 63)]; }
function genByLevel(lv) { return lv === 0 ? genIpEasy() : lv === 1 ? genIp() : genIpHard(); }
function ipForPrefix(p) {
  if (p < 16) return [10, rnd(0, 255), rnd(0, 255), rnd(1, 254)];
  const r = Math.random();
  if (r < 0.5) return [192, 168, rnd(0, 255), rnd(1, 254)];
  if (r < 0.8) return [172, rnd(16, 31), rnd(0, 255), rnd(1, 254)];
  return [10, rnd(0, 255), rnd(0, 255), rnd(1, 254)];
}

/* [LOGIC] one octet: 1 to 8 binary digits whose value matches */
const okBits = (s, v) => { s = s.replace(/\s+/g, ''); return /^[01]{1,8}$/.test(s) && parseInt(s, 2) === v; };

/* [LOGIC] works out what a wrong binary answer probably means */
function explain(raw, v) {
  const s = raw.replace(/\s+/g, '');
  const t8 = s.padStart(8, '0'), c = bin8(v), tv = parseInt(s, 2);
  const flip = [...t8].map(b => b === '1' ? '0' : '1').join('');
  const rev = [...t8].reverse().join('');
  const extra = [], missing = [];
  for (let i = 0; i < 8; i++) {
    if (t8[i] === '1' && c[i] === '0') extra.push(W[i]);
    if (t8[i] === '0' && c[i] === '1') missing.push(W[i]);
  }
  const plural = a => a.length > 1;
  const nbits = n => n + (n === 1 ? ' bit' : ' bits');
  const diff = extra.length + missing.length;
  const details = [];
  if (extra.length) details.push('You wrote 1 in the ' + list(extra) + (plural(extra) ? ' places' : ' place') + ', but ' + v + (plural(extra) ? " doesn't use them." : " doesn't use it."));
  if (missing.length) details.push('You wrote 0 in the ' + list(missing) + (plural(missing) ? ' places' : ' place') + ', but ' + v + (plural(missing) ? ' needs them.' : ' needs it.'));
  let why;
  if (s.length < 8 && s + '0'.repeat(8 - s.length) === c) {
    why = 'You wrote only ' + nbits(s.length) + '. An octet has 8, and a short answer is read from the right, so the missing ' + (8 - s.length === 1 ? '0 at the end' : '0s at the end') + ' changed every place value. Write all 8 bits.';
  } else if (diff >= 2 && rev === c) {
    why = 'The bits are in reverse order. The leftmost bit is the biggest place value (128) and the rightmost is the smallest (1).';
  } else if (diff >= 2 && flip === c) {
    why = 'Every bit is flipped. A 1 means that power of two is used and a 0 means it is not.';
  } else if (s === String(v)) {
    why = 'You copied the decimal digits of ' + v + ' as if they were binary. Binary needs place values: break ' + v + ' into 128s, 64s, 32s and so on.';
  } else if (diff >= 2 && t8 === c.slice(1) + '0') {
    why = 'Your bits are shifted one place to the left, so every 1 is worth double what it should be. Start at the 128 place and count 8 places.';
  } else if (diff >= 2 && t8 === '0' + c.slice(0, 7)) {
    why = 'Your bits are shifted one place to the right, so every 1 is worth half what it should be. Start at the 128 place and count 8 places.';
  } else {
    const pre = [];
    if (s.length < 8) pre.push('You wrote ' + nbits(s.length) + '. A short answer is read from the right, as ' + t8 + '.');
    if (Math.abs(tv - v) === 1) pre.push('Close: your bits add up to ' + tv + ', only 1 off.');
    why = pre.concat(details).join(' ');
  }
  return { s, t8, tv, why, short: s !== t8 };
}

/* ============ [STATE] saved progress ============ */
const KEY = 'netbits-v1';
const S = { xp: 0, lv: 1, mode: 'ip2bin', theme: 'dark', modes: {} };
function loadState() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && typeof o === 'object') Object.assign(S, o);
    const legacy = parseInt(localStorage.getItem('ip2bin-best'), 10); // old single-mode best streak
    if (legacy > 0) { const m = stat('ip2bin'); if (legacy > m.b) m.b = legacy; }
  } catch (e) {}
}
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function stat(id) { return S.modes[id] || (S.modes[id] = { s: 0, e: 0, b: 0, sp: 0 }); }
const LEVELS = ['Easy', 'Standard', 'Hard'];
const playerLevel = () => 1 + Math.floor(Math.sqrt(S.xp / 40));
function stars(id) {
  const m = S.modes[id]; if (!m) return 0;
  const t = m.s + m.e, acc = t ? m.s / t : 0;
  return (m.s >= 60 && acc >= 0.9) ? 3 : (m.s >= 30 && acc >= 0.8) ? 2 : (m.s >= 10) ? 1 : 0;
}

/* ============ [DOM] tiny builders ============ */
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function setRich(node, s) { // ^7 becomes a superscript
  node.textContent = '';
  String(s).split(/(\^[0-9?]+)/).forEach(p => {
    if (/^\^[0-9?]+$/.test(p)) node.appendChild(el('sup', null, p.slice(1)));
    else if (p) node.appendChild(document.createTextNode(p));
  });
}

/* ---------- same subnet? ---------- */
const PCS = ['Front desk PC', 'Accounts PC', 'Lab PC 4', 'Manager laptop', 'Library PC', 'HR workstation'];
const PRINTERS = ['Accounts laser', 'Front-desk printer', 'Lab printer', 'Staff-room MFP', 'Library scanner'];
function lessonSame(q, given, pick) {
  const { a, b, p } = q.meta, ra = subnetCalc(a, p), rb = subnetCalc(b, p), same = ra.net === rb.net, c = el('article', 'lcard');
  if (pick != null && pick !== q.correct) c.appendChild(el('p', 'para m', 'You chose: ' + q.options[pick]));
  const t = el('p', 'why'); t.append(el('b', null, 'Right answer. '), q.options[q.correct]); c.appendChild(t);
  c.appendChild(el('p', 'para', 'Each device\'s network address is its address ANDed with the mask (/' + p + ' = ' + ipStr(ra.m) + ').'));
  c.appendChild(tbl(['Device', 'Address', 'Network'], [[q.meta.na, ipStr(a), ipStr(toArr(ra.net))], [q.meta.nb, ipStr(b), ipStr(toArr(rb.net))]]));
  c.appendChild(el('p', 'para', same ? 'The network addresses match, so both devices are on one subnet and can talk directly.' : 'The network addresses differ, so the printer is on another subnet. Traffic must go through a router, or the printer needs an address inside the PC\'s subnet.'));

}
def('samesub', {
  short: 'Same subnet?',
  grp: 'Addressing a peripheral', name: 'Can the PC reach it?', tag: 'ITINET1753B 1.5, 4.5',
  desc: 'Can the PC and printer reach each other?',
  gen(lv) {
    const p = lv === 0 ? 24 : lv === 1 ? pickOne([24, 25, 26]) : pickOne([22, 23, 25, 26, 27, 28]), size = pow2(32 - p);
    const region = toInt([192, 168, 0, 0]), blocks = 65536 / size, k = rnd(1, blocks - 2), base = region + k * size;
    const off = () => rnd(1, size - 2), same = Math.random() < 0.5;
    const A = base + off(); let B;
    if (same) { do { B = base + off(); } while (B === A); }
    else {
      const k2 = (lv === 2 && Math.random() < 0.7) ? (Math.random() < 0.5 ? k + 1 : k - 1) : rnd(1, blocks - 2);
      const kk = k2 === k ? k + 1 : k2, nb = region + kk * size;
      B = nb + ((lv === 2) ? (Math.random() < 0.5 ? 1 : size - 2) : off());
    }
    const a = toArr(A), b = toArr(B), na = pickOne(PCS), nb = pickOne(PRINTERS);
    const ok = subnetCalc(a, p).net === subnetCalc(b, p).net;
    const q = choiceQ({

      options: ['Yes, same subnet', 'No, different subnets'], correct: ok ? 0 : 1, two: true,
      hint: 'Work out each network address with the same mask. Same network address means same subnet.',
      note: ok ? 'Same network address, so they share a subnet.' : 'Different network addresses, so a router is needed or the printer address must change.',
      meta: { a, b, p, na, nb }
    });
    q.lesson = (qq, pick) => lessonSame(qq, null, pick);

  }

const PRESETS = [
  { p: 24, pool: [100, 199], srv: [10, 20] }, { p: 25, pool: [60, 99], srv: [10, 20] },
  { p: 26, pool: [20, 39], srv: [5, 6] }, { p: 27, pool: [10, 19], srv: [4] }

def('printer', {
  short: 'Printer setup',
  grp: 'Addressing a peripheral', name: 'Set up a network printer', tag: 'ITINET1753B 1.2, 1.5',
  desc: 'Pick a valid static address for a new printer.',
  gen(lv) {
    const pre = lv === 0 ? PRESETS[0] : lv === 1 ? pickOne(PRESETS.slice(0, 2)) : pickOne(PRESETS), size = pow2(32 - pre.p);
    const a3 = rnd(1, 200), k = rnd(0, 256 / size - 1), net = toInt([192, 168, a3, 0]) + k * size, bc = net + size - 1, gw = net + 1;
    const srv = pre.srv.map(o => net + o), lo = net + pre.pool[0], hi = net + pre.pool[1];
    const good = []; for (let o = 2; o <= size - 2; o++) { if (pre.srv.includes(o)) continue; if (o >= pre.pool[0] && o <= pre.pool[1]) continue; good.push(o); }
    const correct = net + pickOne(good);
    const bad = {
      net: [net, 'is the network address. It names the subnet and cannot be given to a device.'],
      bc: [bc, 'is the broadcast address. It reaches every device on the subnet.'],
      gw: [gw, 'is the gateway (the router). Using it would clash with the router.'],
      srv: [pickOne(srv), 'is already used by the file server.'],
      pool: [net + rnd(pre.pool[0] + 1, pre.pool[1] - 1), 'is inside the DHCP pool. DHCP could give it to a PC and cause a conflict.'],
      other: [net + size + rnd(2, size - 3), 'belongs to a different subnet, so PCs on this subnet cannot reach it directly.']
    };
    const picks = shuffle(Object.keys(bad)).slice(0, 3);
    const opts = shuffle([{ ip: correct, ok: true, r: 'is a free host address: not the network, broadcast, gateway, a server or in the DHCP pool.' }].concat(picks.map(x => ({ ip: bad[x][0], ok: false, r: bad[x][1] }))));
    const A = toArr(net), pfx = A[0] + '.' + A[1] + '.' + A[2] + '.';
    const lines = ['Subnet: ' + ipStr(A) + '/' + pre.p, 'Gateway: ' + ipStr(toArr(gw)), 'DHCP pool: ' + pfx + (pre.pool[0] + (net & 255)) + '-' + (pre.pool[1] + (net & 255)), 'File server: ' + pre.srv.map(o => ipStr(toArr(net + o))).join(', ')];

      feedback: pick => ipStr(toArr(opts[pick].ip)) + ' ' + opts[pick].r,
      hint: 'A device cannot use the network address, broadcast, gateway, an address already in use, or anything in the DHCP pool. It must also be inside the subnet.',
      note: 'After connecting the printer, test it for correct operation (for example ping it and print a test page) and give it a meaningful name.',
      body: () => opts.map(o => { const p = el('p', 'para'); p.append(el('b', 'mono', ipStr(toArr(o.ip))), ' ' + o.r); return p; })
    });
  }
});

  out.push(sec('Naming convention (15 characters)', [tbl(['Characters', 'Meaning', 'Example'], [['1 - 4', 'City or town', 'KING'], ['5 - 7', 'Type of peripheral', 'LSR'], ['8 - 10', 'Workplace location', 'ACC'], ['11 - 15', 'Device number', '00012']]), el('p', 'para m', 'KINGLSRACC00012')]));
  out.push(sec('Print priorities', [el('p', 'para', 'One print device, three logical printers: Laser_High for executives, Laser_Normal for managers, Laser_Low for everyone. Higher priority jobs go first in the queue.')]));
  out.push(sec('Decimal to binary as a script', [el('pre', 'code', ALGO)]));
  return out;
}
function openStudy() {
  if (sp.on) return;
  openSheet({ title: 'Study sheet', sub: 'Quick reference from your course outlines and lecture notes.', body: studyNodes(), foot: [{ label: 'Close', primary: true, fn: () => closeSheet() }] });
}

/* ============ [WIRING] ============ */
function applyTheme() { root.dataset.theme = S.theme; $('tc').setAttribute('content', S.theme === 'light' ? '#f6f6f4' : '#0b0b0c'); }
function themeLabel() { $('theme-btn').textContent = 'Theme: ' + (S.theme === 'light' ? 'Light' : 'Dark'); }
function levelLabel() { $('lv-btn').textContent = 'Level: ' + LEVELS[S.lv]; }
checkBtn.addEventListener('click', check);
skipBtn.addEventListener('click', () => { if (!done) { clearTimeout(sp.adv); newQ(); } });
hintBtn.addEventListener('click', hint);
$('modes-btn').addEventListener('click', openModes);
$('study-btn').addEventListener('click', openStudy);
$('lv-btn').addEventListener('click', () => { S.lv = (S.lv + 1) % 3; saveState(); levelLabel(); streak = 0; updateStats(); newQ(); });
$('weights-btn').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on)); wtEl.hidden = !on; layout();
});
$('theme-btn').addEventListener('click', () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; saveState(); applyTheme(); themeLabel(); });

/* [NEW] header dropdown menu: one three-line button reveals Modes,
   Study, Level, Sprint, Weights and Theme, so the header itself
   only ever shows the title and a single menu button. */
const menuBtn = $('menu-btn'), menuEl = $('menu');
function openMenu() { menuEl.hidden = false; menuBtn.setAttribute('aria-expanded', 'true'); }
function closeMenu() { menuEl.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', e => { e.stopPropagation(); menuEl.hidden ? openMenu() : closeMenu(); });
menuEl.addEventListener('click', e => { if (e.target.closest('.mi')) closeMenu(); });
document.addEventListener('click', e => { if (!menuEl.hidden && !e.target.closest('.menu-wrap')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menuEl.hidden) closeMenu(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) { e.preventDefault(); return; }
  if (sheetOpen || !Q) return;
  if (Q.type === 'choice' && !done && /^[1-9]$/.test(e.key) && Number(e.key) <= Q.options.length) { pickChoice(Number(e.key) - 1); return; }
  if (e.key === 'Enter' && done && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); nextQ(); }
});

loadState();
if (!MODES[S.mode]) S.mode = 'ip2bin';
if (![0, 1, 2].includes(S.lv)) S.lv = 1;
applyTheme(); themeLabel(); levelLabel(); titleEl.textContent = MODES[S.mode].short || MODES[S.mode].name; updateStats();
newQ();
</script>
